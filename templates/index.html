<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="scanlines"></div>

    <div class="ui-container">
        <!-- Header -->
        <header class="hud-header">
            <div class="logo">
                <span class="logo-text">F Y R A</span>
                <span class="logo-sub">PERSONAL AI // v2.0</span>
            </div>
            <div class="status-bar">
                <div class="status-indicator" id="statusDot"></div>
                <span class="status-text" id="statusText">READY</span>
            </div>
            <div class="header-right">
                <span class="date-time" id="dateTime"></span>
            </div>
        </header>

        <!-- Main -->
        <main class="main-content">

            <!-- Orb -->
            <div class="orb-container">
                <canvas id="orbCanvas" width="580" height="580"></canvas>
                <div class="orb-state-text" id="orbStateText">STANDBY</div>
                <div class="orb-response" id="orbResponse"></div>
            </div>

        </main>

        <!-- Hidden log (keeps socket handlers working) -->
        <div id="conversationLog" style="display:none"></div>
        <!-- Hidden profile fields -->
        <span id="favourName" style="display:none"></span>
        <span id="favourLikes" style="display:none"></span>
        <span id="fiyinName"  style="display:none"></span>
        <span id="fiyinLikes" style="display:none"></span>
        <span id="openTasks"  style="display:none"></span>
        <span id="lastIntent" style="display:none"></span>
        <span id="voiceStatus" style="display:none"></span>
        <input id="voiceIdInput" style="display:none"/>

        <!-- Input -->
        <footer class="input-area">
            <button class="mic-btn" id="micBtn" title="Voice input">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <div class="input-wrapper">
                <input type="text" id="textInput" placeholder="ASK FYRA ANYTHING..." autocomplete="off" spellcheck="false"/>
                <div class="input-line"></div>
            </div>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/js/fyra.js"></script>
</body>
</html>
