<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYRA</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="apple-touch-icon" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="ui-container">

        <!-- Top-left: mute -->
        <button class="corner-btn mute-btn" id="micBtn">MIC</button>

        <!-- Top-right: connection status -->
        <div class="conn-status">
            <div class="status-indicator" id="statusDot"></div>
            <span class="conn-text" id="connText">connected</span>
        </div>

        <!-- Particle orb -->
        <canvas id="orbCanvas" width="700" height="700"></canvas>

        <!-- State label + response -->
        <div class="orb-state-text" id="orbStateText">STANDBY</div>
        <div class="orb-response" id="orbResponse"></div>

        <!-- Input bar -->
        <footer class="input-area">
            <div class="input-wrapper">
                <input type="text" id="textInput" placeholder="ask fyra anything..." autocomplete="off" spellcheck="false"/>
                <div class="input-line"></div>
            </div>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </footer>
    </div>

    <!-- Hidden: keeps socket handlers working -->
    <div id="conversationLog" style="display:none"></div>
    <span id="favourName"  style="display:none"></span>
    <span id="favourLikes" style="display:none"></span>
    <span id="fiyinName"   style="display:none"></span>
    <span id="fiyinLikes"  style="display:none"></span>
    <span id="openTasks"   style="display:none"></span>
    <span id="lastIntent"  style="display:none"></span>
    <span id="voiceStatus" style="display:none"></span>
    <input id="voiceIdInput" style="display:none"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/js/fyra.js"></script>
</body>
</html>
