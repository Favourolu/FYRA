<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#88ccff" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#3380ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#001133" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4499ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#001133" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#000"/>

  <!-- Outer glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Core orb -->
  <circle cx="32" cy="32" r="14" fill="url(#core)"/>

  <!-- Orbital particles -->
  <circle cx="32" cy="10" r="2.2" fill="#66bbff" opacity="0.85"/>
  <circle cx="52" cy="22" r="1.6" fill="#4499ff" opacity="0.7"/>
  <circle cx="54" cy="44" r="1.8" fill="#3380ff" opacity="0.6"/>
  <circle cx="32" cy="56" r="2.0" fill="#66bbff" opacity="0.8"/>
  <circle cx="10" cy="44" r="1.5" fill="#4499ff" opacity="0.65"/>
  <circle cx="11" cy="22" r="1.8" fill="#3380ff" opacity="0.75"/>

  <!-- Inner highlight -->
  <circle cx="27" cy="27" r="4" fill="#aaddff" opacity="0.3"/>
</svg>
